name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # publish the JUnit test report
      pull-requests: write # annotate failing tests on the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests run entirely on in-memory H2 (src/test/resources/application.yml)
      # and the Gemini agent is mocked, so no database or API key is required.
      - name: Build and run tests
        run: mvn -B -ntp clean verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Unit & integration tests
          include_passed: true
          detailed_summary: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - name: Upload packaged jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-jar
          path: target/*.jar
          if-no-files-found: ignore
