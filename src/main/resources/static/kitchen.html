<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display | RamsAI Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }

        .kds-page { padding: 110px 3% 40px; max-width: 1600px; margin: 0 auto; }

        .kds-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
        }
        .kds-topbar h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .kds-topbar h1 i { color: var(--primary-color); }
        .kds-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        .kds-conn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .kds-conn .dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; }
        .kds-conn.live .dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.25); }
        .kds-conn.live { color: #4ade80; }
        .kds-conn.down .dot { background: #f59e0b; }
        .kds-conn.down { color: #fbbf24; }

        .kds-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s, border-color 0.15s;
        }
        .kds-btn:hover { background: #334155; }
        .kds-btn.active { border-color: var(--primary-color); color: var(--primary-color); }

        .kds-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 960px) { .kds-board { grid-template-columns: 1fr; } }

        .kds-column {
            background: #111c33;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 14px;
            min-height: 200px;
        }
        .kds-col-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px 14px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 14px;
        }
        .kds-col-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kds-col-new h2 i { color: #60a5fa; }
        .kds-col-cooking h2 i { color: #fbbf24; }
        .kds-col-ready h2 i { color: #4ade80; }
        .kds-count {
            background: #1e293b;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .kds-cards { display: flex; flex-direction: column; gap: 14px; }

        .kds-card {
            background: #1b2740;
            border: 1px solid #2a3a5c;
            border-left: 5px solid #60a5fa;
            border-radius: 12px;
            padding: 14px;
            animation: kdsIn 0.25s ease-out;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .kds-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
        .kds-col-cooking .kds-card { border-left-color: #fbbf24; }
        .kds-col-ready .kds-card { border-left-color: #4ade80; }
        .kds-card.flash { animation: kdsFlash 1.2s ease-out; }
        @keyframes kdsIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        @keyframes kdsFlash { 0% { box-shadow: 0 0 0 3px rgba(96,165,250,0.6); } 100% { box-shadow: none; } }

        .kds-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .kds-order-id { font-weight: 800; font-size: 1.05rem; }
        .kds-table {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 2px 9px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #93c5fd;
            margin-left: 8px;
        }
        .kds-elapsed { font-size: 0.82rem; font-weight: 700; color: #94a3b8; white-space: nowrap; }
        .kds-elapsed.warn { color: #fbbf24; }
        .kds-elapsed.danger { color: #f87171; }

        .kds-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .kds-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            background: #0f1a30;
            border-radius: 8px;
            padding: 8px 10px;
        }
        .kds-item.item-done { opacity: 0.5; }
        .kds-item-main { min-width: 0; flex: 1; }
        .kds-item-name { font-weight: 600; font-size: 0.95rem; }
        .kds-item-name .qty { color: var(--primary-color); font-weight: 800; margin-right: 4px; }
        .kds-note {
            margin-top: 6px;
            background: #422006;
            border: 1px solid #854d0e;
            color: #fde68a;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.82rem;
            display: flex;
            gap: 7px;
            align-items: flex-start;
        }
        .kds-note i { margin-top: 2px; }
        .kds-item-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .kds-item-btn {
            border: none;
            border-radius: 8px;
            padding: 7px 13px;
            min-height: 36px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: filter 0.15s, transform 0.1s;
        }
        .kds-item-btn:hover { filter: brightness(1.1); }
        .kds-item-btn:active { transform: scale(0.95); }
        .kds-item-btn.btn-start { background: #60a5fa; }
        .kds-item-btn.btn-ready { background: #4ade80; }
        .kds-item-btn.btn-serve { background: #fbbf24; }

        .kds-actions { display: flex; gap: 8px; margin-top: 12px; }
        .kds-action {
            flex: 1;
            border: none;
            border-radius: 9px;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            color: #0f172a;
            transition: filter 0.15s;
        }
        .kds-action:hover { filter: brightness(1.08); }
        .kds-action.start { background: #60a5fa; }
        .kds-action.ready { background: #4ade80; }
        .kds-action.serve { background: #cbd5e1; }
        .kds-action.ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }

        .kds-empty { text-align: center; color: #64748b; padding: 24px 8px; font-size: 0.9rem; }
        .kds-empty i { font-size: 1.8rem; display: block; margin-bottom: 8px; color: #334155; }

        @media (max-width: 480px) {
            .kds-page { padding: 95px 12px 30px; }
            .kds-topbar h1 { font-size: 1.4rem; }
        }

        /* AI Chat Styles */
        .ai-chat-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--primary-color, #6366f1);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.2s;
        }
        .ai-chat-toggle:hover { transform: scale(1.1); }
        .ai-chat-toggle .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary-color, #6366f1);
            opacity: 0.6;
            animation: pulse 2s infinite;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .ai-chat-window {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 400px;
            height: 550px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        .ai-chat-window.hidden { transform: scale(0); opacity: 0; pointer-events: none; }
        
        .ai-chat-header {
            padding: 16px 20px;
            background: #111c33;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px 16px 0 0;
        }
        .ai-chat-header h3 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .ai-chat-header h3 i { color: #60a5fa; }
        .ai-chat-header button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; }

        .ai-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .ai-message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .ai-message.user {
            align-self: flex-end;
            background: var(--primary-color, #6366f1);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai-message.ai {
            align-self: flex-start;
            background: #334155;
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
        }
        .ai-message.system {
            align-self: center;
            background: rgba(96, 165, 250, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(96, 165, 250, 0.2);
            font-size: 0.85rem;
            text-align: center;
            max-width: 95%;
        }

        .ai-thinking {
            padding: 0 20px 10px;
            display: flex;
            gap: 4px;
        }
        .ai-thinking span {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }
        .ai-thinking span:nth-child(1) { animation-delay: -0.32s; }
        .ai-thinking span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes thinking {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .ai-chat-input {
            padding: 15px 20px;
            background: #111c33;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            border-radius: 0 0 16px 16px;
        }
        .ai-chat-input input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            outline: none;
        }
        .ai-chat-input button {
            background: var(--primary-color, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<header>
    <div class="logo">Rams-AI <span>Kitchen</span></div>
    <nav><ul id="mainNav"></ul></nav>
</header>

<main class="kds-page">
    <div class="kds-topbar">
        <h1><i class="fas fa-fire-burner"></i> Kitchen Display</h1>
        <div class="kds-controls">
            <span id="connStatus" class="kds-conn down"><span class="dot"></span> Connecting…</span>
            <button id="soundToggle" class="kds-btn active" type="button" title="Toggle new-order sound">
                <i class="fas fa-volume-high"></i> Sound
            </button>
            <button id="refreshBtn" class="kds-btn" type="button" title="Reload board">
                <i class="fas fa-rotate-right"></i> Refresh
            </button>
        </div>
    </div>

    <div class="kds-board">
        <section class="kds-column kds-col-new">
            <div class="kds-col-header">
                <h2><i class="fas fa-bell"></i> New</h2>
                <span class="kds-count" id="count-RECEIVED">0</span>
            </div>
            <div class="kds-cards" id="col-RECEIVED"></div>
        </section>

        <section class="kds-column kds-col-cooking">
            <div class="kds-col-header">
                <h2><i class="fas fa-utensils"></i> Cooking</h2>
                <span class="kds-count" id="count-COOKING">0</span>
            </div>
            <div class="kds-cards" id="col-COOKING"></div>
        </section>

        <section class="kds-column kds-col-ready">
            <div class="kds-col-header">
                <h2><i class="fas fa-circle-check"></i> Ready</h2>
                <span class="kds-count" id="count-READY">0</span>
            </div>
            <div class="kds-cards" id="col-READY"></div>
        </section>
    </div>

    <!-- AI Chat Toggle Button -->
    <button id="aiChatToggle" class="ai-chat-toggle" title="Chef Assistant AI">
        <i class="fas fa-robot"></i>
        <span class="pulse"></span>
    </button>

    <!-- AI Chat Window -->
    <div id="aiChatWindow" class="ai-chat-window hidden">
        <div class="ai-chat-header">
            <h3><i class="fas fa-robot"></i> Sous-Chef AI</h3>
            <button id="closeChat"><i class="fas fa-times"></i></button>
        </div>
        <div id="aiChatMessages" class="ai-chat-messages">
            <div class="ai-message system">
                <i class="fas fa-info-circle"></i>
                Welcome, Chef! How can I help you with your recipes today?
            </div>
        </div>
        <div id="aiThinking" class="ai-thinking hidden">
            <span></span><span></span><span></span>
        </div>
        <form id="aiChatForm" class="ai-chat-input">
            <input type="text" id="aiInput" placeholder="Ask about recipes..." autocomplete="off">
            <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/realtime.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/ai-chat.js"></script>
</body>
</html>
